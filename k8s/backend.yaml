apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rbac-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: REGION-docker.pkg.dev/PROJECT_ID/rbac-repo/backend:latest
          env:
            - name: KEYCLOAK_ISSUER
              value: "http://136.69.114.34/auth/realms/rbac-demo"
            - name: KEYCLOAK_AUDIENCE
              value: "rbac-demo-app"
            - name: CORS_ORIGINS
              value: "*"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rbac-demo
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000